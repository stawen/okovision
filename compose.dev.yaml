name: okovision-dev

x-database: &database
  image: mariadb:11.4
  environment:
    MARIADB_DATABASE: okovision
    MARIADB_USER: okovision
    MARIADB_PASSWORD_FILE: /run/secrets/db_password
    MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    TZ: UTC
  secrets:
    - db_password
    - db_root_password
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 2s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  db:
    <<: *database
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./setup/install.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./tests/sql/okovision-dataset.sql:/docker-entrypoint-initdb.d/20-fixtures.sql:ro
  db-test:
    <<: *database
    profiles: ["test"]
    ports:
      - "127.0.0.1:${DEV_TEST_DB_PORT:-3308}:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./setup/install.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./tests/sql/okovision-dataset.sql:/docker-entrypoint-initdb.d/20-fixtures.sql:ro

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE in .env.dev}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_PATH:?Set DB_ROOT_PASSWORD_PATH in .env.dev}
