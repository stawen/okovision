name: Release candidate

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de préversion, par exemple v2.0.0-rc.1"
        required: true
        type: string

concurrency:
  group: release-candidate-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code sélectionné
        uses: actions/checkout@v4

      - name: Vérifier le tag et préparer le nom de l'image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]] || [[ "$RELEASE_TAG" != "v${version}-rc."* ]]; then
            echo "Le tag doit être v${version}-rc.N, avec N entier." >&2
            exit 1
          fi
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Ce tag existe déjà : $RELEASE_TAG" >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "Impossible de vérifier les tags distants." >&2
            exit "$status"
          fi
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configurer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image de vérification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: okovision:rc-smoke
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Vérifier le démarrage sans base de données
        run: |
          set -euo pipefail
          container="$(docker run -d --read-only --tmpfs /tmp --network none okovision:rc-smoke)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" node --input-type=module -e "const r = await fetch('http://127.0.0.1:3000/api/v1/health'); process.exit(r.ok ? 0 : 1)" 2>/dev/null; then
              docker exec "$container" node --input-type=module -e "await import('./knexfile.js')"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          echo "Le contrôle de vitalité a échoué." >&2
          exit 1

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Créer la préversion GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --generate-notes \
            --notes "Image Docker : \`${IMAGE}:${RELEASE_TAG}\` (linux/amd64 et linux/arm64)."
