name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version stable sans v, identique à package.json (ex. 2.0.0)"
        required: true
        type: string
      publish_latest:
        description: "Publier aussi cette version sous le tag latest"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code sélectionné
        uses: actions/checkout@v4

      - name: Vérifier la version et préparer les tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "La version doit être une version stable X.Y.Z sans préfixe v." >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "La version demandée ($RELEASE_VERSION) doit correspondre à package.json ($package_version)." >&2
            exit 1
          fi

          release_tag="v$RELEASE_VERSION"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$release_tag" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Ce tag existe déjà : $release_tag" >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "Impossible de vérifier les tags distants." >&2
            exit "$status"
          fi

          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "IMAGE=$image"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "DOCKER_TAGS<<EOF"
            echo "$image:$release_tag"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Configurer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image de vérification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: okovision:release-smoke
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Vérifier le démarrage sans base de données
        run: |
          set -euo pipefail
          container="$(docker run -d --read-only --tmpfs /tmp --network none okovision:release-smoke)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" node --input-type=module -e "const r = await fetch('http://127.0.0.1:3000/api/v1/health'); process.exit(r.ok ? 0 : 1)" 2>/dev/null; then
              docker exec "$container" node --input-type=module -e "await import('./knexfile.js')"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          echo "Le contrôle de vitalité a échoué." >&2
          exit 1

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Créer le tag et la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          notes="Image Docker : \`${IMAGE}:${RELEASE_TAG}\` (linux/amd64 et linux/arm64)."
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            notes+=" Le tag \`${IMAGE}:latest\` pointe aussi vers cette version."
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "$notes"
